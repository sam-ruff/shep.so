[package]
name = "shep-mail-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[features]
default = []
test-support = []

[dependencies]
shep-mail-content = { path = "../mail-content" }
anyhow = "1"
async-trait = "0.1"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
mailparse = "0.16"
native-tls = "0.2"
secrecy = { version = "0.10", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-native-tls = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
