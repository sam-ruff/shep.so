[package]
name = "shep-mail-content"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
# mime.rs mirrors this version's multipart boundary traversal before recursion.
mailparse = "=0.16.1"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
ammonia = "4.1.4"
cssparser = "0.37"
url = "2"
percent-encoding = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
