[package]
name = "shep-calendar-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
anyhow = { version = "1.0.104", optional = true }
async-trait = { version = "0.1.92", optional = true }
chrono = { version = "0.4", features = ["serde"] }
mockall = { version = "0.15.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
urlencoding = { version = "2.1.3", optional = true }

[dev-dependencies]
mockall = "0.15.0"
serde_json = "1"
tokio = { version = "1.53.1", features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }

[features]
http = ["dep:anyhow", "dep:async-trait", "dep:serde_json", "dep:urlencoding", "dep:reqwest"]
test-support = ["http", "dep:mockall"]
