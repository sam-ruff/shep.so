server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    # Behind the host proxy, redirects must not name the container's port.
    absolute_redirect off;

    # Plain static site, not an SPA: unknown paths are 404s so /beta can be
    # served by its own container behind the same host.
    location / {
        try_files $uri $uri/ =404;
    }

    # The demo uses relative asset paths, which need the trailing slash.
    location ~ ^/demo(/app)?$ {
        return 301 $uri/;
    }

    location ~ ^/(demo/(app/)?)?index\.html$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|wasm|ttf)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
