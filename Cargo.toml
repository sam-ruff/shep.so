[package]
name = "shep"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A calm email and calendar client with excellent mouse and keyboard support"
license = "MIT"

[features]
default = []
test-support = []

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "svg", "image-without-codecs", "advanced", "x11", "wayland", "linux-theme-detection"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
rfd = "0.17"
scraper = "0.27"
cssparser = "0.37"
litehtml = "=0.2.6"
shep-html-pixbuf = { path = "vendor/shep-html-pixbuf" }
shep-profile-core = { git = "https://github.com/sam-ruff/shep.so", rev = "9289f5327b71bb6aaff463ee965eab48c13df85a", features = ["history"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "backup", "hooks", "limits"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
mailparse = "0.16"
mime_guess = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
secrecy = { version = "0.10", features = ["serde"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
bytes = "1"
percent-encoding = "2"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
url = "2"
webbrowser = "1"
roxmltree = "0.21"
ical = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
rapidfuzz = "0.5"
regex = "1"
cosmic-text = "0.15"
unicode-normalization = "0.1"
fs2 = "0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
notify-rust = { version = "=4.17.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
same-file = "1"

[dev-dependencies]
litehtml-sys = { version = "=0.2.5", features = ["shep-test-support"] }
tokio = { version = "1", features = ["test-util"] }
iced_tiny_skia = "=0.14.0"
tiny-skia = "0.11"

[patch.crates-io]
litehtml-sys = { path = "vendor/litehtml-sys" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }

[[bench]]
name = "responsiveness"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[profile.test-ui]
inherits = "release"
debug = 1
lto = false
codegen-units = 16
strip = false
