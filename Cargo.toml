[package]
name = "shep"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A calm email and calendar client with excellent mouse and keyboard support"
license = "MIT"

[features]
default = []
test-support = ["shep-profile-core/test-support"]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "svg", "image-without-codecs", "advanced", "x11", "wayland", "linux-theme-detection"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
rfd = "0.17"
scraper = "0.27"
cssparser = "0.37"
litehtml = "=0.2.6"
shep-html-pixbuf = { path = "vendor/shep-html-pixbuf" }
shep-profile-core = { git = "https://github.com/sam-ruff/shep.so", rev = "e3e69a4ea71baa6bcc6f98f2d567f6b542adc77d", features = ["drive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache", "backup", "hooks", "limits"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
curl = { version = "0.4.50", features = ["protocol-ftp", "static-curl"] }
curl-sys = "0.4.89"
mailparse = "0.16"
mime_guess = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "xml"] }
russh = { version = "0.63.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.0"
tokio-util = { version = "0.7", features = ["codec", "io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
secrecy = { version = "0.10", features = ["serde"] }
aes-gcm = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
bytes = "1"
percent-encoding = "2"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
url = "2"
webbrowser = "1"
roxmltree = "0.21"
ical = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
rapidfuzz = "0.5"
regex = "1"
cosmic-text = "0.15"
unicode-normalization = "0.1"
fs2 = "0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "=0.3.6"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "=0.24.2"
notify-rust = { version = "=4.17.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }
dispatch2 = "=0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
ab_glyph = "=0.2.32"
windows = { version = "=0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
winreg = "0.55"
same-file = "1"

[dev-dependencies]
rcgen = "0.14.10"
rand_sftp = { package = "rand", version = "0.10" }
ab_glyph = "=0.2.32"
shep-profile-core = { git = "https://github.com/sam-ruff/shep.so", rev = "e3e69a4ea71baa6bcc6f98f2d567f6b542adc77d", features = ["test-support"] }
litehtml-sys = { version = "=0.2.5", features = ["shep-test-support"] }
tokio = { version = "1", features = ["test-util"] }
iced_tiny_skia = "=0.14.0"
tiny-skia = "0.11"

[patch.crates-io]
curl = { path = "vendor/curl" }
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
litehtml-sys = { path = "vendor/litehtml-sys" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }

[[bench]]
name = "responsiveness"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[profile.test-ui]
inherits = "release"
debug = 1
lto = false
codegen-units = 16
strip = false
