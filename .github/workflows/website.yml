# Builds the promotional site image and pushes it to the house registry.
# There is no semantic-release here: every push to main is tagged as
# latest and sha-<7 char sha>.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/logo-light.webp"
      - "assets/logo-dark.webp"
      - "docs/images/mail-light.webp"
      - "docs/images/calendar-dark.webp"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: registry.tail2d6fbe.ts.net/shep/website

jobs:
  build:
    runs-on: [self-hosted, sophie-small]
    timeout-minutes: 30
    env:
      # Step conditions cannot read secrets, so resolve the push decision here.
      # Until the zot account's secrets exist the image is built but not pushed.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && secrets.ZOT_USERNAME != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install test tooling
        run: |
          # The tests save review screenshots as WebP through Pillow; the pool image has no pip.
          python3 -c 'import PIL' || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends python3-pil; }
          npx playwright install --with-deps chromium

      - name: Playwright (Chromium)
        run: npm test

      - name: Set image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Let Docker resolve the lab cache
        # Docker reaches cgr.dev through the pool's cache.local proxy, and its Go
        # resolver cannot look up mDNS names, so pin the address glibc resolves.
        run: |
          addr=$(getent ahostsv4 cache.local | awk 'NR==1 {print $1}')
          if [ -n "$addr" ] && ! grep -q '[[:space:]]cache\.local$' /etc/hosts; then
            echo "$addr cache.local" | sudo tee -a /etc/hosts
          fi

      - name: Build image
        working-directory: .
        run: |
          docker build -f website/Dockerfile \
            -t "$IMAGE:${{ steps.tag.outputs.sha }}" \
            -t "$IMAGE:latest" .

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.tail2d6fbe.ts.net
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Push image
        if: env.PUBLISH == 'true'
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.sha }}"
          docker push "$IMAGE:latest"

      - name: Report a skipped push
        if: env.PUBLISH != 'true'
        run: echo "::notice::Image built but not pushed. Pushes need main and the ZOT_USERNAME/ZOT_PASSWORD secrets."
