# The promotional image has its own source identity, not an application release.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "web/**"
      - "shared/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/shepherd-light.svg"
      - "docs/images/mail-light.webp"
      - "docs/images/calendar-dark.webp"
      - ".github/workflows/website.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "website/**"
      - "web/**"
      - "shared/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/shepherd-light.svg"
      - "docs/images/mail-light.webp"
      - "docs/images/calendar-dark.webp"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: registry.tail2d6fbe.ts.net/shep/website

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, sophie]
    # The image compiles the demo's WebAssembly and wasm-bindgen-cli from source.
    timeout-minutes: 60
    env:
      # Step conditions cannot read secrets, so resolve the push decision here.
      # Until the zot account's secrets exist the image is built but not pushed.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ZOT_USERNAME != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build browser demo
        working-directory: .
        # The image's Rust stage compiles the demo's WebAssembly, so the runner
        # needs no Rust toolchain and the final image build reuses this cache.
        run: docker build -f website/Dockerfile --target demo-files --output type=local,dest=web/dist-preview .

      - name: Build site
        run: npm run build

      - name: Check publishing contract
        run: npm run test:deployment

      - name: Install test tooling
        run: |
          # The tests save review screenshots as WebP through Pillow; the pool image has no pip.
          python3 -c 'import PIL' || { sudo apt-get -o DPkg::Lock::Timeout=300 update -q && sudo apt-get -o DPkg::Lock::Timeout=300 install -y -q --no-install-recommends python3-pil; }
          npx playwright install --with-deps chromium

      - name: Playwright (Chromium)
        run: npm test

      - name: Set image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: .
        run: |
          docker build -f website/Dockerfile \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg VERSION="${{ steps.tag.outputs.sha }}" \
            -t "$IMAGE:${{ steps.tag.outputs.sha }}" .

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: registry.tail2d6fbe.ts.net
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Push image
        if: env.PUBLISH == 'true'
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.sha }}"

      - name: Report a skipped push
        if: env.PUBLISH != 'true'
        run: echo "::notice::Image built but not pushed. Pushes need main and the ZOT_USERNAME/ZOT_PASSWORD secrets."
