name: Windows runner probe

# Temporary: bisects why Windows clones are lost a few minutes into a job. Each phase is reported
# through a commit status, since a lost job keeps neither its log nor its annotations.
on:
  pull_request:
    paths:
      - .github/workflows/windows-runner-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      HEARTBEAT_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
    steps:
      - name: Start heartbeat
        run: |
          $post = {
              param($context, $text)
              $body = @{ state = 'pending'; context = $context; description = $text.Substring(0, [Math]::Min(140, $text.Length)) } | ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri $env:HEARTBEAT_URL -Body $body -ContentType 'application/json' -TimeoutSec 8 `
                  -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } | Out-Null
          }
          # When the hand-off started runner.ps1 and when the guest agent last ran commands, to compare
          # the loss against the daemon's ten-minute registration timeout.
          try {
              $log = Get-Item 'C:\ProgramData\ci-hatchery\runner.log' -ErrorAction SilentlyContinue
              $start = (Select-String -LiteralPath $log.FullName -Pattern '^Start time: (\d{14})' -ErrorAction SilentlyContinue | Select-Object -First 1).Matches.Groups[1].Value
              $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
              & $post 'windows-clone-history' ('now {0:HH:mm:ss} boot {1:HH:mm:ss} log {2:HH:mm:ss} start {3}' -f (Get-Date).ToUniversalTime(), $boot, $log.CreationTimeUtc, $start)
              $agent = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'qemu-ga' } -MaxEvents 3 -ErrorAction SilentlyContinue)
              $events = ($agent | ForEach-Object { '{0:HH:mm:ss} {1}' -f $_.TimeCreated.ToUniversalTime(), ($_.Message -replace '\s+', ' ') }) -join ' | '
              & $post 'windows-clone-agent' ("$($agent.Count) events: $events")
          } catch { Write-Output "history: $_" }
          # If the guest restarts rather than being stopped from outside, a startup task reports the
          # System log's shutdown records; a clone stopped by the host reports nothing.
          $probe = 'C:\ProgramData\shep-probe'
          [void][IO.Directory]::CreateDirectory($probe)
          Set-Content -LiteralPath (Join-Path $probe 'target.txt') -Value $env:HEARTBEAT_URL, $env:GH_TOKEN
          Set-Content -LiteralPath (Join-Path $probe 'after-boot.ps1') -Value @'
          $url, $token = Get-Content -LiteralPath 'C:\ProgramData\shep-probe\target.txt'
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
          # Shutdown records only: a clean restart (1074 names the process), an unexpected one (6008,
          # 41), a kernel-initiated one (109) or a bug check (1001).
          $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'System'; Id = 41, 109, 1001, 1074, 1076, 6006, 6008 } -MaxEvents 8 -ErrorAction SilentlyContinue)
          $reports = @(@{ context = 'windows-clone-restart'; text = "boot {0:HH:mm:ss}, {1} shutdown records" -f $boot, $events.Count })
          $index = 0
          foreach ($record in $events) {
              $index++
              $text = '{0:HH:mm:ss} {1} {2} {3}' -f $record.TimeCreated.ToUniversalTime(), $record.Id, $record.ProviderName, ($record.Message -replace '\s+', ' ')
              # A status description holds 140 characters; 1074 names the process first and the reason later.
              for ($part = 0; $part -lt 3 -and $part * 140 -lt $text.Length; $part++) {
                  $reports += @{ context = "windows-clone-restart-$index-$part"; text = $text.Substring($part * 140) }
              }
          }
          foreach ($report in $reports) {
              foreach ($attempt in 1..30) {
                  try {
                      $body = @{ state = 'pending'; context = $report.context; description = $report.text.Substring(0, [Math]::Min(140, $report.text.Length)) } | ConvertTo-Json
                      Invoke-RestMethod -Method Post -Uri $url -Body $body -ContentType 'application/json' -TimeoutSec 8 `
                          -Headers @{ Authorization = "Bearer $token"; Accept = 'application/vnd.github+json' } | Out-Null
                      break
                  } catch { Start-Sleep -Seconds 5 }
              }
          }
          # Then how setup looks after the restart, until the job's token lapses.
          foreach ($beat in 1..40) {
              try {
                  $setup = Get-ItemProperty 'HKLM:\SYSTEM\Setup'
                  $image = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Setup\State').ImageState -replace '^IMAGE_STATE_', ''
                  $names = (Get-Process).ProcessName
                  $text = '#{0} {1:HH:mm:ss} boot {2:HH:mm:ss} oobe{3} sys{4} img {5} cxh{6} wwa{7} expl{8} logon{9}' -f $beat, (Get-Date).ToUniversalTime(), $boot,
                      $setup.OOBEInProgress, $setup.SystemSetupInProgress, $image, [int]($names -contains 'CloudExperienceHostBroker'),
                      [int]($names -contains 'WWAHost'), [int]($names -contains 'explorer'), [int]($names -contains 'LogonUI')
                  $body = @{ state = 'pending'; context = 'windows-clone-after-restart'; description = $text } | ConvertTo-Json
                  Invoke-RestMethod -Method Post -Uri $url -Body $body -ContentType 'application/json' -TimeoutSec 8 `
                      -Headers @{ Authorization = "Bearer $token"; Accept = 'application/vnd.github+json' } | Out-Null
              } catch { }
              Start-Sleep -Seconds 15
          }
          '@
          $action = New-ScheduledTaskAction -Execute 'C:\Program Files\PowerShell\7\pwsh.exe' -Argument "-NoProfile -NonInteractive -File $probe\after-boot.ps1"
          Register-ScheduledTask -TaskName 'shep-probe-after-boot' -Action $action -Trigger (New-ScheduledTaskTrigger -AtStartup) `
              -User 'SYSTEM' -RunLevel Highest -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'phase.txt') -Value 'start'
          $script = Join-Path $env:RUNNER_TEMP 'heartbeat.ps1'
          Set-Content -LiteralPath $script -Value @'
          $beat = 0
          while ($true) {
              $beat++
              try {
                  $os = Get-CimInstance Win32_OperatingSystem
                  $phase = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'phase.txt') -ErrorAction SilentlyContinue
                  # Candidate signals that Windows setup has really finished, to gate runner registration.
                  $setup = Get-ItemProperty 'HKLM:\SYSTEM\Setup'
                  $image = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Setup\State').ImageState -replace '^IMAGE_STATE_', ''
                  $names = (Get-Process).ProcessName
                  $flags = 'oobe{0} sys{1} mini{2} img {3} cxh{4} wwa{5} expl{6} logon{7}' -f $setup.OOBEInProgress, $setup.SystemSetupInProgress, $setup.MiniSetupInProgress, $image,
                      [int]($names -contains 'CloudExperienceHostBroker'), [int]($names -contains 'WWAHost'), [int]($names -contains 'explorer'), [int]($names -contains 'LogonUI')
                  $text = '#{0} {1:HH:mm:ss} boot {2:HH:mm:ss} {3} {4}' -f $beat, (Get-Date).ToUniversalTime(), $os.LastBootUpTime.ToUniversalTime(), $phase, $flags
                  $body = @{ state = 'pending'; context = 'windows-runner-probe'; description = $text } | ConvertTo-Json
                  Invoke-RestMethod -Method Post -Uri $env:HEARTBEAT_URL -Body $body -ContentType 'application/json' -TimeoutSec 8 `
                      -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } | Out-Null
              } catch { }
              Start-Sleep -Seconds 10
          }
          '@
          Start-Process pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-File', $script -WindowStyle Hidden
      - name: Idle for six minutes
        run: |
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'phase.txt') -Value 'idle'
          Start-Sleep -Seconds 360
      - name: Download through the proxy without writing to disk
        run: |
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'phase.txt') -Value 'network'
          $client = [Net.Http.HttpClient]::new()
          foreach ($round in 1..4) {
              $stream = $client.GetStreamAsync('https://static.rust-lang.org/dist/rustc-1.96.0-x86_64-pc-windows-msvc.tar.xz').GetAwaiter().GetResult()
              try { $stream.CopyTo([IO.Stream]::Null) } finally { $stream.Dispose() }
              Write-Output "round $round done"
          }
      - name: Write many files without network
        run: |
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'phase.txt') -Value 'disk'
          $root = Join-Path $env:RUNNER_TEMP 'disk-probe'
          $block = [byte[]]::new(65536)
          [Random]::new(1).NextBytes($block)
          foreach ($dir in 1..40) {
              $folder = Join-Path $root $dir
              [void][IO.Directory]::CreateDirectory($folder)
              foreach ($file in 1..500) { [IO.File]::WriteAllBytes((Join-Path $folder "$file.bin"), $block) }
          }
          $large = [IO.File]::Create((Join-Path $root 'large.bin'))
          try { foreach ($chunk in 1..48000) { $large.Write($block, 0, $block.Length) } } finally { $large.Dispose() }
          Remove-Item -LiteralPath $root -Recurse -Force
      - name: Install a Rust toolchain as the CI job does
        shell: bash
        run: |
          echo toolchain > "$RUNNER_TEMP/phase.txt"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Report completion
        if: always()
        run: |
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'phase.txt') -Value 'finished'
          Start-Sleep -Seconds 15
